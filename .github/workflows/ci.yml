name: FreshRoute CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 2 & committed artifact integrity tests
        run: |
          python -m pytest -v tests/test_phase2_pipelines.py -k "not test_district_centroids_exclude_imputed_and_cover_top6"
          python -m pytest -v tests/test_pipeline_integrity.py -k "test_2_feature_allowlist_and_formula_guard or test_5_mandatory_baseline_reporting"
