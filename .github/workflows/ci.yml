name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freshroute-optimizer-model
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: freshroute-optimizer-model/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build gold tables (DVC, gitignored — must exist for D3 test)
        run: |
          python scripts/build_gold_mandi.py --date 2026-08-18 || true
          python scripts/build_gold_weather.py --lat 30.9 --lon 75.85 --date 2026-08-18 || true
          python scripts/build_gold_osm.py || true

      - name: Pytest (28 tests, spec 6.2 must-pass)
        run: python -m pytest tests/ -q

      - name: Coverage (informational, 36% current, gate 85% per plan 12)
        run: python -m pytest tests/test_optimizer.py --cov=core --cov-report=term | tail -20

      - name: Citation audit (0 TODO debt)
        run: python scripts/citation_audit.py --bib ../docs/BIBLIOGRAPHY.bib --root ..

      - name: GE suites on synthetic
        run: PYTHONPATH=. python -m data.validation.ge_suites --check-all

      - name: Forecaster WAPE <18% gate
        run: PYTHONPATH=. python -m core.demand_forecaster --days 30 --test-days 7

      - name: Monte Carlo sim KPI >=92%
        run: PYTHONPATH=. python scripts/monte_carlo_sim.py --days 30
