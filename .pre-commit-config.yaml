repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^paper/
      - id: end-of-file-fixer
        exclude: ^(paper/|.*\.parquet)
      - id: check-yaml
      - id: check-json
        exclude: freshroute-optimizer-model/data/gold/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.5
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        files: ^freshroute-optimizer-model/(core|api|scripts|tests)/.*\.py$

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^freshroute-optimizer-model/(core|api)/.*\.py$
